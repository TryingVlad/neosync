name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Debug build: signed with the auto-generated debug key, so no secrets
      # are needed. Note the debug key differs per machine/runner, so an APK
      # from CI cannot be installed over one built locally without uninstalling.
      - name: Build and test
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare artifact
        run: |
          mkdir release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/neosync.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neosync-apk
          path: release/neosync.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
