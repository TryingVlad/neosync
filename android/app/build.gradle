plugins {
    alias(libs.plugins.android.application)
}
def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
android {
    namespace 'dev.neosync.boox'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    def keystoreFile = System.getenv("KEYSTORE_FILE") ?: keystoreProperties["KEYSTORE_FILE"]
    if (keystoreFile != null) {
        signingConfigs {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties["KEYSTORE_PASSWORD"]
                keyAlias System.getenv("KEY_ALIAS") ?: keystoreProperties["KEY_ALIAS"]
                keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties["KEY_PASSWORD"]
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
                shrinkResources false
            }
        }
    }
    defaultConfig {
        applicationId "dev.neosync.boox"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "8.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Side-by-side install next to the release app, as "NeoSync - Dev".
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildToolsVersion '36.1.0'
    testOptions {
        // android.util.Log etc. are stubs in JVM unit tests; let them no-op.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    // android.jar's org.json is a stub in JVM tests; use the real one.
    testImplementation libs.json
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}